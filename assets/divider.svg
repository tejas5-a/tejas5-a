<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="img" aria-label="Section divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#FF7A00" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="13" width="1200" height="2" fill="#FF7A00" opacity="0.25"/>
  <rect x="-300" y="13" width="300" height="2" fill="url(#pulse)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1500 0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <polygon points="600,4 612,14 600,24 588,14" fill="#FF7A00">
    <animateTransform attributeName="transform" type="rotate" values="0 600 14;180 600 14;360 600 14" dur="6s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="600" cy="14" r="3" fill="#FFFFFF">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
